<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LocalCart - Buy & Sell Second-Hand Items</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <header>
        <h1>LocalCart</h1>
        <p>Buy & Sell Second-Hand Items Near You</p>
    </header>

    <section class="form-section">
        <h2>Upload an Item</h2>
        <input type="text" id="title" placeholder="Item Name" />
        <input type="number" id="price" placeholder="Price" />
        <input type="text" id="location" placeholder="Your Location" />
        <button onclick="addItem()">Add Item</button>
    </section>

    <section class="list-section">
        <h2>Items Near You</h2>
        <ul id="itemList"></ul>
    </section>

    <script src="script.js"></script>
</body>
</html>
